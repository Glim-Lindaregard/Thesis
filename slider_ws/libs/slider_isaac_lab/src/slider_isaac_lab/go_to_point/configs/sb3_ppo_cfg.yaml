# Reference: https://github.com/DLR-RM/rl-baselines3-zoo/blob/master/hyperparams/ppo.yml#L32
seed: 100

# epoch * n_steps * nenvs: 500×512*8*8
n_timesteps: 20_000_000
policy: slider_isaac_lab.utils.squashed_ac_sb3.CustomActorCriticPolicy
n_steps: 200
# mini batch size: num_envs * nsteps / nminibatches 2048×512÷2048
batch_size: 102400
gae_lambda: 0.95
gamma: 0.99
n_epochs: 10
ent_coef: 0.0
vf_coef: 0.5
learning_rate: !!float 3e-4
clip_range: 0.2
policy_kwargs:
  log_std_init: -1
  features_extractor_class: slider_isaac_lab.utils.squashed_ac_sb3.DictObsExtractor
  features_extractor_kwargs:
    features_dim: 64

#   net_arch:
#     pi: [256, 128, 64]
#     vf: [256, 128, 64]
# target_kl: 0.01
max_grad_norm: 0.5

# normalize_input: True
# normalize_value: True
